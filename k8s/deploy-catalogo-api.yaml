apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-api
  namespace: catalogo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogo-api
  template:
    metadata:
      labels:
        app: catalogo-api
    spec:
      containers:
        - name: catalogo-api
          image: diazrodrigoar/catalogo-api:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: catalogo-api-config
          env:
            # Mismo Secret que MongoDB; nombres distintos a los de las claves almacenadas
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: catalogo-db-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogo-db-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
