services:
  catalogo-db:
    container_name: catalogo-db
    image: mongo:7
    cap_drop:
      - ALL
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - catalogo-db-data:/data/db
    networks:
      - catalogo-net
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  catalogo-api:
    container_name: catalogo-api
    build:
      context: ./backend
    image: catalogo-api:v1
    cap_drop:
      - ALL
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: ${APP_VERSION}
      ROOT_PATH: ${ROOT_PATH}
      SEED_DEMO: ${SEED_DEMO}
    ports:
      - "8000:8000"
    networks:
      - catalogo-net
    depends_on:
      catalogo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"

  catalogo-frontend:
    container_name: catalogo-frontend
    build:
      context: ./frontend
    image: catalogo-frontend:v1
    cap_drop:
      - ALL
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
    ports:
      - "3000:8080"
    networks:
      - catalogo-net
    depends_on:
      catalogo-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/healthz

networks:
  catalogo-net:
    name: catalogo-net

volumes:
  catalogo-db-data:
    name: catalogo-db-data
