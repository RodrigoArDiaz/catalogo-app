apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogo-app-ingress
  namespace: {{ include "catalogo-app.namespace" . }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalogo-frontend
                port:
                  number: 8080