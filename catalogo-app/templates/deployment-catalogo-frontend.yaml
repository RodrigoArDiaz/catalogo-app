apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-frontend
  namespace: {{ include "catalogo-app.namespace" . }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: catalogo-frontend
  template:
    metadata:
      labels:
        app: catalogo-frontend
    spec:
      containers:
        - name: catalogo-frontend
          image: {{ printf "%s:%s" .Values.frontend.image.repository .Values.frontend.image.tag }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalogo-frontend-config