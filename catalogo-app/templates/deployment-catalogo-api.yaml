apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-api
  namespace: {{ include "catalogo-app.namespace" . }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: catalogo-api
  template:
    metadata:
      labels:
        app: catalogo-api
    spec:
      containers:
        - name: catalogo-api
          image: {{ printf "%s:%s" .Values.api.image.repository .Values.api.image.tag }}
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
          envFrom:
            - configMapRef:
                name: catalogo-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: catalogo-db-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogo-db-secret
                  key: MONGO_INITDB_ROOT_PASSWORD